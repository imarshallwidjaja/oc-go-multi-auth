name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Node 24 ships npm >= 11.5.1, the minimum for npm trusted publishing.
      # The publish workflow uses the same toolchain, so CI exercises it first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check npm version
        run: |
          version="$(npm --version)"
          printf '%s\n' 11.5.1 "$version" | sort -V -C || { echo "::error::npm $version is older than 11.5.1"; exit 1; }

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      # Builds, packs once, and smoke-tests the installed archive.
      - run: node scripts/verify-package.mjs
